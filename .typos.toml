# typos (crate-ci/typos) 設定。
# https://github.com/crate-ci/typos
#
# scope: docs/ と meta/ の md / 限定的に py。SONiC 固有用語が大量にあるため
# default 辞書では誤検知が出やすい。default-extend-identifiers で除外する。

[default]
# ファイル全体スキャン。バイナリは自動 skip される。
extend-ignore-re = [
    # SHA / hash 値 (6+ 桁 hex)。短い fragment 引用 (4ba9612 等) もスキップ。
    "\\b[0-9a-fA-F]{6,}\\b",
    # @<short-sha> パターン
    "@[0-9a-fA-F]{4,}",
    # mermaid 内の ascii art / arrow
    "-->",
    # コードフェンス内の生コード（行単位ではなく block 単位検出が望ましいが、簡易版）
    "`[^`]+`",
    # 末尾省略 (…) で word が途中で切られた表示 (auto-generated sitemap 等)。
    "\\b[A-Za-z][A-Za-z]+…",
]

[default.extend-words]
