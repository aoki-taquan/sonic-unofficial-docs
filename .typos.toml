[files]
extend-exclude = [
    ".cache/",
    ".venv/",
    "site/",
    ".claude/",
    "node_modules/",
    "*.svg",
    "*.png",
    "*.jpg",
    "*.pdf",
    "meta/built-html-report.md",
    "meta/built-links-report.md",
    "meta/discrepancy-related-yang-report.md",
    "meta/frontmatter-lint-report*.md",
]
