# AER (Advanced Error Reporting, PCIe), AKE (Redis keyspace event flag),
# BA (Behavior Aggregate / iteration code 等),
# OER (Outer Extinction Ratio, optic), OIF (Optical Internetworking Forum),
# PN (Part Number / packet number), fand (旧 HLD daemon 名), cacl (caclmgrd)。
