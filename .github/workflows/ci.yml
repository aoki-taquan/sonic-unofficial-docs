name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 全 job 共通の Python 設定。`cache: pip` は setup-python が pip wheel cache を
# requirements.txt の hash でキー化するため、actions/cache を別途張る必要は
# ない。lint 系で PyYAML だけ単独 install していたステップも、同じ key で
# wheel をヒットさせるため `pip install -r requirements.txt` に統一する。
env:
  PYTHON_VERSION: "3.12"

jobs:
  # 静的サイトの build 検証。`--strict` で broken-link / nav 問題を全部落とす。
  # mkdocs build はこの job 1 つだけで走らせ、他 job では重複させない。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: mkdocs build --strict

      # built HTML 品質チェック (informational)。`site/` 配下を走査し
      # `<h1>` 重複・空 `<a>`/`<img>`・空コードブロック・mermaid placeholder
      # 残骸などを `meta/built-html-report.md` に出す。高優先 (h1 重複/空 a/img)
      # は 0 件キープが目標。CI では `|| true` で落とさず report を artifact 化。
      - name: built HTML quality (informational)
        run: python3 meta/scripts/check_built_html.py || true

      - name: Upload built-html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-html-report
          path: meta/built-html-report.md
          if-no-files-found: ignore

  # タイポ検知 (crate-ci/typos)。設定は .typos.toml。
  # SONiC エコシステム用語は extend-words / extend-ignore-re / extend-exclude
  # で除外。既知 245 件の typo を整理して strict 化済み。
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: typos check (strict)
        uses: crate-ci/typos@master
        with:
          files: docs meta README.md CONTRIBUTING.md
          config: .typos.toml

  # 外部 URL リンク切れ検知 (lychee)。設定は .lychee.toml。
  # 内部リンクは mkdocs --strict でカバー済みなので外部だけ走らせる。
  # GitHub の rate-limit 緩和のため GITHUB_TOKEN を渡す。
  # initial 段階では informational。orphan URL の整理が進んだら strict 化。
  link-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - name: lychee external link check (informational)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --cache --config .lychee.toml 'docs/**/*.md' 'README.md' 'CONTRIBUTING.md'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: false

  # textlint (日本語表記揺れ・技術文書スタイル)。設定は .textlintrc.json。
  # prh ルールは meta/prh-sonic.yml で SONiC 固有用語を統一。
  # 既存違反を一括 fix し、誤検知の多い preset rule を無効化したうえで
  # strict 化済み。残違反は CI を落とすので新規追加時は textlint --fix を
  # 走らせること。
  textlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: textlint (strict)
        run: npx textlint 'docs/**/*.md'

  # frontmatter linter (strict) + 全 drift / 各種 informational check。
  # 元は job を細かく分けて並走させていたが、setup-python の起動オーバヘッド
  # の方が大きく、step は ~10 秒 / job 並走による並列効果は小さいため、
  # lint 系を 1 job に集約してキャッシュも 1 回で済むようにした。
  # strict 系の中で drift をまとめて流したいものは run_all_checks.sh、
  # 単独で log を残したいものは個別 step として並べる。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # --- strict checks (exit != 0 で job を落とす) -------------------
      - name: Frontmatter linter v2 (strict)
        run: python3 meta/scripts/frontmatter_lint.py

      # 不可視文字 / bidi 制御 / tag char (prompt-injection ベクター) 検出。
      # 0 件キープが必須。理由・運用は meta/scripts/check_invisible_chars.py の
      # docstring を参照。許可コメントで例外指定可能。
      - name: Invisible chars / bidi controls (strict)
        run: python3 meta/scripts/check_invisible_chars.py

      - name: Runbook verification status (strict)
        run: python3 meta/scripts/check_runbook_status.py --check

      - name: Runbook structure 5-section check (strict)
        run: python3 meta/scripts/check_runbook_structure.py --check

      - name: .pages awesome-pages integrity (strict)
        run: python3 meta/scripts/check_pages_integrity.py --check

      - name: discrepancy pages have non-empty related.yang (strict)
        run: python3 meta/scripts/check_discrepancy_related.py --strict --report meta/discrepancy-related-yang-report.md

      - name: link-density split-child nav (strict)
        run: python3 meta/scripts/check_link_density.py --strict-split-child

      # --- generator drift checks (strict, run_all_checks.sh に集約) ----
      - name: All generator drift checks (strict)
        run: bash meta/scripts/run_all_checks.sh

      # snapshot / chapter-progress / next-reads は run_all_checks.sh に
      # 含まれていないため、それぞれ単独で並べる (失敗時 log で即特定)。
      - name: snapshot.md drift (strict)
        run: python3 meta/scripts/gen_snapshot.py --check

      # chapter-progress は .pages 順に全サブページを走査してテーブルを生成。
      # フロントマター行数が実ファイルと乖離しないよう strict 化。
      - name: chapter-progress drift (strict)
        run: python3 meta/scripts/gen_chapter_progress.py --check

      # --- informational checks (`|| true` で落とさない) ---------------

      - name: next-reads drift (informational)
        run: python3 meta/scripts/gen_next_reads.py --check || true


      - name: verification self-consistency suspects (informational)
        run: python3 meta/scripts/check_verification_self_consistency.py || true

      - name: monitor consistency suspects (informational)
        run: python3 meta/scripts/check_monitor_consistency.py --check || true

      - name: evolved_beyond_hld 6C lint (informational)
        run: python3 meta/scripts/check_evolved_6c.py --check || true

      - name: not_implemented workaround depth suspects (informational)
        run: python3 meta/scripts/check_ni_workaround_depth.py --check || true

      - name: partial-boundary suspects (informational)
        run: python3 meta/scripts/check_partial_boundary.py --check || true

      - name: mermaid block syntax check (informational)
        run: python3 meta/scripts/check_mermaid_syntax.py --check || true

      - name: partial-boundary phase-table (strict)
        run: python3 meta/scripts/check_partial_boundary.py --strict-phase-table

      - name: citation-deficient pages (informational)
        run: python3 meta/scripts/check_citation_quality.py --check || true

      - name: broken intra-doc links (informational)
        run: python3 meta/scripts/check_broken_links.py --check || true

      - name: link-density outliers (informational)
        run: python3 meta/scripts/check_link_density.py --check || true

      - name: heading hierarchy skips a11y (informational)
        run: python3 meta/scripts/check_heading_hierarchy.py --check || true

      - name: image alt-text a11y (informational)
        run: python3 meta/scripts/check_image_alt.py --check || true

      - name: untagged code-block language (informational)
        run: python3 meta/scripts/check_code_lang.py --check || true

      - name: stale-verified pages (informational)
        run: python3 meta/scripts/check_stale_verified.py --check || true

      - name: troubleshoot/verify-command section coverage (informational)
        run: python3 meta/scripts/check_troubleshoot_section.py --check || true

      - name: sitemap.md drift (informational)
        run: python3 meta/scripts/gen_sitemap.py --check || true

      - name: Drop site/ leftover (disk hygiene)
        if: always()
        run: rm -rf site/

      - name: Check chapter-index related.* aggregation drift (strict)
        run: |
          pip install PyYAML
          python3 meta/scripts/enrich_chapter_index_related.py --check

      # ruff: meta/scripts 配下の Python 品質 (strict)。
      # 重い rule は外し、pyflakes (F) + isort (I) + bugbear 一部に絞り込み。
      # 設定は pyproject.toml の [tool.ruff] 参照。
      - name: Python lint (ruff, strict)
        run: |
          pip install ruff
          ruff check meta/scripts/

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            meta/frontmatter-lint-report.md
            meta/frontmatter-lint-report-v2.md
            meta/discrepancy-related-yang-report.md
          if-no-files-found: ignore
