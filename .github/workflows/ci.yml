name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: mkdocs build --strict

  frontmatter-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install PyYAML

      - name: Run frontmatter linter (v2)
        run: python meta/scripts/frontmatter_lint.py

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontmatter-lint-report
          path: |
            meta/frontmatter-lint-report.md
            meta/frontmatter-lint-report-v2.md
          if-no-files-found: ignore
