name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: mkdocs build --strict

  frontmatter-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install PyYAML

      - name: Run frontmatter linter (v2)
        run: python meta/scripts/frontmatter_lint.py

      - name: Report verification self-consistency suspects (informational)
        run: python3 meta/scripts/check_verification_self_consistency.py || true

      - name: Report monitor-consistency suspects (informational)
        run: python3 meta/scripts/check_monitor_consistency.py --check || true

      - name: Check runbook verification status
        run: python3 meta/scripts/check_runbook_status.py --check

      - name: Report citation-deficient pages (informational)
        run: python3 meta/scripts/check_citation_quality.py --check

      - name: Check .pages awesome-pages integrity
        run: python3 meta/scripts/check_pages_integrity.py --check

      - name: Report broken intra-doc links (informational)
        run: python3 meta/scripts/check_broken_links.py --check

      - name: Report link-density outliers (informational)
        run: python3 meta/scripts/check_link_density.py --check

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontmatter-lint-report
          path: |
            meta/frontmatter-lint-report.md
            meta/frontmatter-lint-report-v2.md
          if-no-files-found: ignore

  quality-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check docs/index.md quality banner is up to date
        run: python3 meta/scripts/gen_index_banner.py --check

  discrepancy-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check docs/reference/verification/discrepancy-index.md is up to date
        run: python3 meta/scripts/gen_discrepancy_index.py --check

  coverage-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check docs/_meta/coverage.md is up to date
        run: python3 meta/scripts/gen_coverage.py --check

      - name: Report stale-verified pages (informational)
        run: python3 meta/scripts/check_stale_verified.py --check

      - name: Check docs/_meta/sitemap.md drift (informational)
        run: |
          pip install PyYAML
          python3 meta/scripts/gen_sitemap.py --check || true

  topics-back-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check area-page Topics back-ref blocks are up to date
        run: python3 meta/scripts/gen_cross_ref.py --check

  glossary-xref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check glossary reverse-index is up to date
        run: python3 meta/scripts/gen_glossary_xref.py --check
