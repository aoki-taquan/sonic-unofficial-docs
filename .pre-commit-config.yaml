# Pre-commit hooks for sonic-unofficial-docs.
#
# Usage:
#   pip install pre-commit
#   pre-commit install
#   pre-commit run --all-files
#
# Hooks:
#   - frontmatter-lint: meta/scripts/frontmatter_lint.py で docs/**/*.md の
#     frontmatter を検証（CI と同じチェック）
#   - mkdocs-build: mkdocs build --strict で静的サイトのビルドを検証
repos:
  - repo: local
    hooks:
      - id: frontmatter-lint
        name: frontmatter linter (docs/**/*.md)
        entry: python meta/scripts/frontmatter_lint.py
        language: system
        pass_filenames: false
        files: ^docs/.*\.md$
        additional_dependencies: []

      - id: mkdocs-build
        name: mkdocs build --strict
        entry: mkdocs build --strict
        language: system
        pass_filenames: false
        files: ^(docs/|mkdocs\.yml$|requirements\.txt$)
