site_name: SONiC 非公式ドキュメント
site_description: SONiC NOS（sonic-net/SONiC）の日本語非公式ドキュメント
site_url: https://aoki-taquan.github.io/sonic-unofficial-docs/
repo_url: https://github.com/aoki-taquan/sonic-unofficial-docs
repo_name: aoki-taquan/sonic-unofficial-docs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  # mkdocs-material 9.x の search プラグインは lunr index を内蔵で
  # ビルド時に生成する。旧 mkdocs 純正の `prebuild_index` 相当は
  # material/search では deprecated（常時有効）なので明示指定はしない。
  - search:
      lang: ja
      separator: '[\s\-、。・]+'
  - awesome-pages
  - tags
  # OG カード生成。mkdocs-material 標準の social プラグイン。
  # 画像生成に cairosvg / Pillow を要するため requirements.txt は
  # `mkdocs-material[imaging]` を指定している。MKDOCS_SOCIAL_CARDS=0 を
  # 設定すれば cards 生成を抑止できる（ローカルで imaging deps が無い場合等）。
  - social:
      cards: !ENV [MKDOCS_SOCIAL_CARDS, true]
  - rss:
      match_path: ".*"
      date_from_meta:
        as_creation: date
      categories:
        - tags

extra_css:
  - stylesheets/extra.css

copyright: >
  &copy; 2024–2026 sonic-unofficial-docs contributors —
  本ドキュメントは <a href="https://creativecommons.org/licenses/by/4.0/deed.ja">CC BY 4.0</a> の下で提供されます。
  SONiC 本体および公式ドキュメントとは無関係の非公式資料です。

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aoki-taquan/sonic-unofficial-docs
      name: GitHub リポジトリ
    - icon: material/bug
      link: https://github.com/aoki-taquan/sonic-unofficial-docs/issues
      name: Issue tracker（誤情報・改善要望）
    - icon: material/forum
      link: https://github.com/aoki-taquan/sonic-unofficial-docs/discussions
      name: Discussions（質問・運用相談）

# nav は awesome-pages プラグインが各ディレクトリの `.pages` を読んで自動生成する。
# Writer は mkdocs.yml の nav を編集してはならない。並び順を変えたい場合は
# 該当ディレクトリの `.pages` を編集する。
