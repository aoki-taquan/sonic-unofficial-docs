site_name: SONiC 非公式ドキュメント
site_description: SONiC NOS（sonic-net/SONiC）の日本語非公式ドキュメント
site_url: https://aoki-taquan.github.io/sonic-unofficial-docs/
repo_url: https://github.com/aoki-taquan/sonic-unofficial-docs
repo_name: aoki-taquan/sonic-unofficial-docs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: ja

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aoki-taquan/sonic-unofficial-docs

nav:
  - ホーム: index.md
  - アーキテクチャ:
      - architecture/index.md
      - ポート不正パケットドロップ設計: architecture/port-illegal-packets-drop-design.md
  - ルーティング:
      - routing/index.md
  - スイッチング:
      - switching/index.md
  - オーバーレイ:
      - overlay/index.md
  - ACL & QoS:
      - acl-qos/index.md
  - システム:
      - system/index.md
  - マネジメント:
      - management/index.md
  - プラットフォーム:
      - platform/index.md
  - 内部実装:
      - internals/index.md
  - リファレンス:
      - reference/index.md
      - CLI: reference/cli/index.md
      - CONFIG_DB: reference/config-db/index.md
      - YANG: reference/yang/index.md
