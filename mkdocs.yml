site_name: SONiC 非公式ドキュメント
site_description: SONiC NOS（sonic-net/SONiC）の日本語非公式ドキュメント
site_url: https://aoki-taquan.github.io/sonic-unofficial-docs/
repo_url: https://github.com/aoki-taquan/sonic-unofficial-docs
repo_name: aoki-taquan/sonic-unofficial-docs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  # mkdocs-material 9.x の search プラグインは lunr index を内蔵で
  # ビルド時に生成する。旧 mkdocs 純正の `prebuild_index` 相当は
  # material/search では deprecated（常時有効）なので明示指定はしない。
  - search:
      lang: ja
      separator: '[\s\-、。・]+'
  - awesome-pages
  - tags
  # SNS シェア時の OG image を自動生成する mkdocs-material の標準プラグイン。
  # 既定では `enabled: false` にしている。理由:
  #   * 実カード生成には `Pillow` と `cairosvg` (+ システム cairo) が必要で、
  #     ローカル `mkdocs build --strict` 環境にこれらが無いと build が落ちる
  #   * CI / deploy で社会的に出したいときは `SOCIAL=true mkdocs build` で
  #     有効化する。GitHub Actions Ubuntu には libcairo がプリインストール
  #     済みなので、`pip install "mkdocs-material[imaging]"` を追加するだけで動く
  # site_url が設定済みなので、有効時は自動で <meta property="og:image"> が
  # 各ページに挿入される。
  - social:
      enabled: !ENV [SOCIAL, false]

extra_css:
  - stylesheets/extra.css

copyright: >
  &copy; 2024–2026 sonic-unofficial-docs contributors —
  本ドキュメントは <a href="https://creativecommons.org/licenses/by/4.0/deed.ja">CC BY 4.0</a> の下で提供されます。
  SONiC 本体および公式ドキュメントとは無関係の非公式資料です。

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aoki-taquan/sonic-unofficial-docs
      name: GitHub リポジトリ
    - icon: fontawesome/solid/bug
      link: https://github.com/aoki-taquan/sonic-unofficial-docs/issues
      name: Issue Tracker
    - icon: fontawesome/solid/comments
      link: https://github.com/aoki-taquan/sonic-unofficial-docs/discussions
      name: Discussions

# nav は awesome-pages プラグインが各ディレクトリの `.pages` を読んで自動生成する。
# Writer は mkdocs.yml の nav を編集してはならない。並び順を変えたい場合は
# 該当ディレクトリの `.pages` を編集する。
